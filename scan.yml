name: Scan Sendico Pokemon Deals
on:
  workflow_dispatch:
  schedule:
    # Near-real-time GitHub-hosted monitoring: once per hour.
    - cron: "7 * * * *"
permissions:
  contents: write
concurrency:
  group: sendico-pokemon-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Restore PriceCharting reference images
        uses: actions/cache@v4
        with:
          path: data/reference_images
          key: pricecharting-reference-images-${{ runner.os }}-${{ hashFiles('data/watchlist.yaml') }}
          restore-keys: |
            pricecharting-reference-images-${{ runner.os }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium
      - name: Test
        run: pytest -q
      - name: Scan and send alerts as matches are found
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pokemon_deal_bot.main --config config.yaml
      - name: Persist state, reference cache and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/reference_cache.json reports/latest.json reports/latest.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Update scanner state [skip ci]"
            git push
          fi
