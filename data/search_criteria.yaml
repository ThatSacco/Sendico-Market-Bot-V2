# CENTRAL MATCHING AND ALERT CRITERIA
version: 1

seller:
  # 0 disables the positive-rating threshold.
  minimum_positive_ratings: 0
  analyse_unverified_sellers: true

reference_image_matching:
  # Search phrases only discover listings; they do not decide card identity.
  # When true, every discovered listing is checked against every active
  # PriceCharting reference, with search-associated targets checked first.
  compare_all_active_targets: true

  # A positive same-card result at or above this confidence proceeds to
  # detailed image matching. Negative decisions are treated as zero match
  # confidence regardless of how confident Gemini is in the rejection.
  minimum_screening_confidence_for_detail: 0.20

  # Internal screening threshold only. Potential matches are not sent.
  probable_alert_threshold: 0.55

  # Detailed Gemini comparison must return same_card=true and meet this value.
  confirmed_threshold: 0.85

  # Discord receives verified listings only.
  alert_on_probable_match: false
  alert_on_confirmed_match: true
