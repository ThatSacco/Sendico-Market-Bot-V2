name: Add Watchlist Card
on:
  workflow_dispatch:
    inputs:
      pricecharting_url:
        description: "PriceCharting product page URL"
        required: true
        type: string
      search_terms:
        description: "Sendico/Mercari search phrases, one per line"
        required: true
        type: string
      id:
        description: "Optional custom id (auto-derived from the URL if left blank)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: sendico-pokemon-scan
  cancel-in-progress: false
jobs:
  add-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test
        run: pytest -q
      - name: Add card and resolve its PriceCharting reference
        id: add
        env:
          CARD_URL: ${{ inputs.pricecharting_url }}
          CARD_TERMS: ${{ inputs.search_terms }}
          CARD_ID: ${{ inputs.id }}
        run: |
          python scripts/add_watchlist_card.py \
            --url "$CARD_URL" \
            --terms "$CARD_TERMS" \
            --id "$CARD_ID"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.yaml data/reference_cache.json data/reference_images
          git commit -m "Add watchlist card: ${{ steps.add.outputs.card_id }}"
          git push
