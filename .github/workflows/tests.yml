name: Test Sendico Market Bot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sendico-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: python -m compileall -q src
      - run: pytest -q
