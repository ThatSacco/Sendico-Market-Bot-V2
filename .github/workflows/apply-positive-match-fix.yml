              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_main_helpers.py')
          test_path.write_text('''from pokemon_deal_bot.main import (
    _candidate_targets,
    _match_passes,
    _prefer_match,
)
from pokemon_deal_bot.models import (
    ReferenceCard,
    SendicoListing,
    VisualMatch,
)


def _reference(target_id: str) -> ReferenceCard:
    from pathlib import Path

    return ReferenceCard(
        target_id=target_id,
        source_url="https://www.pricecharting.com/game/x/y",
        product_id=target_id,
        name=target_id,
        set_name="",
        card_number="",
        image_url="https://example.test/image.jpg",
        image_path=Path("image.jpg"),
    )


def test_search_association_prioritises_but_does_not_filter_targets():
    listing = SendicoListing(
        code="m1",
        url="https://sendico.test/m1",
        title="lot",
        price_yen=1000,
        candidate_target_ids=["ampharos"],
    )
    references = {
        "victini": _reference("victini"),
        "ampharos": _reference("ampharos"),
    }
    assert _candidate_targets(
        listing,
        references,
        compare_all=True,
    ) == ["ampharos", "victini"]
    assert _candidate_targets(
        listing,
        references,
        compare_all=False,
    ) == ["ampharos"]


def _visual_match(*, same_card: bool, confidence: float) -> VisualMatch:
    return VisualMatch(
        target_id="victini",
        stage="screening",
        same_card=same_card,
        confidence=confidence,
    )


def test_negative_decision_never_passes_match_threshold():
    assert not _match_passes(
        _visual_match(same_card=False, confidence=0.99),
        0.55,
    )
    assert not _match_passes(
        _visual_match(same_card=True, confidence=0.54),
        0.55,
    )
    assert _match_passes(
        _visual_match(same_card=True, confidence=0.55),
        0.55,
    )


def test_positive_decision_is_preferred_over_confident_rejection():
    negative = _visual_match(same_card=False, confidence=1.0)
    positive = _visual_match(same_card=True, confidence=0.60)
    assert _prefer_match(negative, positive) is positive
    assert _prefer_match(positive, negative) is positive
''', encoding='utf-8')
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pytest -q

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-positive-match-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Require positive same-card decision before alerts [skip ci]'
          git push origin HEAD:fix/require-positive-visual-match
