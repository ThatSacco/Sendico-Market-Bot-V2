name: Apply positive visual match fix

on:
  push:
    branches:
      - fix/require-positive-visual-match

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/require-positive-visual-match

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply match-direction fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pokemon_deal_bot/main.py')
          text = path.read_text(encoding='utf-8')

          replacements = []

          old = '''def _report_match(
'''
          new = '''def _match_passes(match: VisualMatch | None, threshold: float) -> bool:
    """Require a positive same-card decision above the confidence threshold.

    Gemini confidence describes confidence in its yes/no decision. A 99%
    confident ``same_card=False`` response is therefore a strong rejection,
    not a 99% match.
    """

    return bool(
        match is not None
        and match.same_card
        and match.confidence >= float(threshold)
    )


def _prefer_match(
    current: VisualMatch | None,
    candidate: VisualMatch,
) -> VisualMatch:
    """Prefer positive decisions, then the stronger confidence."""

    if current is None:
        return candidate
    current_rank = (int(current.same_card), current.confidence)
    candidate_rank = (int(candidate.same_card), candidate.confidence)
    return candidate if candidate_rank > current_rank else current


def _report_match(
'''
          replacements.append((old, new, 'helper insertion'))

          old = '''                            if (
                                best_screen is None
                                or screen.confidence > best_screen.confidence
                            ):
                                best_screen = screen
'''
          new = '''                            best_screen = _prefer_match(best_screen, screen)
'''
          replacements.append((old, new, 'screen result preference'))

          old = '''                            if (
                                screen.confidence
                                >= float(matching["probable_alert_threshold"])
                                and not probable_alerted
                            ):
'''
          new = '''                            if (
                                _match_passes(
                                    screen,
                                    float(matching["probable_alert_threshold"]),
                                )
                                and not probable_alerted
                            ):
'''
          replacements.append((old, new, 'probable alert gate'))

          old = '''                            # A sufficiently strong batch can proceed immediately.
                            if screen.confidence >= float(
                                matching["minimum_screening_confidence_for_detail"]
                            ):
                                break
'''
          new = '''                            # Only a positive same-card decision can proceed.
                            if _match_passes(
                                screen,
                                float(
                                    matching[
                                        "minimum_screening_confidence_for_detail"
                                    ]
                                ),
                            ):
                                break
'''
          replacements.append((old, new, 'detail escalation gate'))

          old = '''                        if (
                            best_screen is None
                            or best_screen.confidence
                            < float(matching["minimum_screening_confidence_for_detail"])
                        ):
                            confidence = best_screen.confidence if best_screen else 0.0
                            outcomes.append(
                                f"{target_id}: screen negative {confidence:.2f}"
                            )
                            continue
'''
          new = '''                        if not _match_passes(
                            best_screen,
                            float(
                                matching[
                                    "minimum_screening_confidence_for_detail"
                                ]
                            ),
                        ):
                            if best_screen is None:
                                outcome = "no screening decision"
                            elif not best_screen.same_card:
                                outcome = (
                                    "rejected as different card "
                                    f"(decision confidence {best_screen.confidence:.2f})"
                                )
                            else:
                                outcome = (
                                    "positive screen below threshold "
                                    f"{best_screen.confidence:.2f}"
                                )
                            outcomes.append(f"{target_id}: {outcome}")
                            continue
'''
          replacements.append((old, new, 'post-screen gate'))

          old = '''                            if (
                                best_detail is None
                                or detail.confidence > best_detail.confidence
                            ):
                                best_detail = detail
                            if (
                                detail.same_card
                                and detail.confidence
                                >= float(matching["confirmed_threshold"])
                            ):
'''
          new = '''                            best_detail = _prefer_match(best_detail, detail)
                            if _match_passes(
                                detail,
                                float(matching["confirmed_threshold"]),
                            ):
'''
          replacements.append((old, new, 'detailed result gate'))

          old = '''                        else:
                            confidence = best_detail.confidence if best_detail else 0.0
                            outcomes.append(
                                f"{target_id}: not confirmed {confidence:.2f}"
                            )
'''
          new = '''                        else:
                            if best_detail is None:
