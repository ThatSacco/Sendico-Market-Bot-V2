                                )
                            else:
                                outcome = (
                                    "detail positive below confirmation threshold "
                                    f"{best_detail.confidence:.2f}"
                                )
                            outcomes.append(f"{target_id}: {outcome}")
'''
          replacements.append((old, new, 'detailed outcome wording'))

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
